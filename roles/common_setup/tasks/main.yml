---
# [1] タイムゾーン設定
- name: "Task: Set timezone to Asia/Tokyo"
  timezone:
    name: Asia/Tokyo

# [2] ネットワーク起動待ちの無効化 (DHCP待ちによる遅延対策)
# インターフェースがオンラインになるのを待たずにブートを続行させます
- name: "Task: Mask systemd-networkd-wait-online service"
  systemd:
    name: systemd-networkd-wait-online.service
    masked: yes
    enabled: no

