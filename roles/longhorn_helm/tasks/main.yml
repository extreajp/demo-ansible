---
- name: "Task: Install Python dependencies"
  apt:
    name: [python3-kubernetes, python3-yaml]
    state: present

- name: "Task: Install Helm binary"
  unarchive:
    src: https://get.helm.sh/helm-v3.14.2-linux-amd64.tar.gz
    dest: /usr/local/bin
    extra_opts: "--strip-components=1"
    remote_src: yes
    creates: /usr/local/bin/helm
  check_mode: no

- name: "Task: Add Longhorn Helm repository"
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: "https://charts.longhorn.io"
  check_mode: no

- name: "Task: Deploy Longhorn via Helm"
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_helm_version }}"
    release_namespace: "{{ longhorn_helm_namespace }}"
    create_namespace: yes
    kubeconfig: "{{ k3s_kubeconfig_path }}"
    values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"
    wait: yes
    timeout: "600s"

- name: "Task: Remove default status from local-path StorageClass"
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_path }}"
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
    state: patched
  ignore_errors: yes
