---
- name: "Step 1: Install Python dependencies"
  apt:
    name: [python3-kubernetes, python3-yaml]
    state: present

- name: "Step 2: Create Longhorn Namespace explicitly"
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ longhorn_helm_namespace }}"
    state: present
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"

- name: "Step 3: Add RKE2 Helm repository"
  kubernetes.core.helm_repository:
    name: "{{ multus_repo_name }}"
    repo_url: "{{ multus_repo_url }}"
    state: present
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"

- name: "Step 4: Deploy Multus and Whereabouts via RKE2 Helm Chart"
  kubernetes.core.helm:
    name: multus
    chart_ref: rke2-charts/rke2-multus
    release_namespace: kube-system
    kubeconfig: "{{ k3s_kubeconfig_path }}"
    update_repo_cache: yes
    values:
      config:
        fullnameOverride: multus
        cni_conf:
          confDir: "{{ multus_conf_dir }}"
          binDir: "{{ multus_bin_dir }}"
          kubeconfig: "{{ multus_kubeconfig_path }}"
          multusAutoconfigDir: "{{ multus_autoconfig_dir }}"
      rke2-whereabouts:
        fullnameOverride: whereabouts
        enabled: true
        cniConf:
          confDir: "{{ multus_conf_dir }}"
          binDir: "{{ multus_bin_dir }}"
    wait: yes
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"

- name: "Step 5: Create NetworkAttachmentDefinition for 10G SDS (Handle 422 Error)"
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_path }}"
    definition:
      apiVersion: "k8s.cni.cncf.io/v1"
      kind: NetworkAttachmentDefinition
      metadata:
        name: "{{ longhorn_helm_sds_network_name }}"
        namespace: "{{ longhorn_helm_namespace }}"
      spec:
        config: "{{ nad_config_content | to_json }}"
  vars:
    nad_config_content:
      cniVersion: "{{ nad_cni_version }}"
      name: "{{ longhorn_helm_sds_network_name }}"
      type: macvlan
      master: "{{ longhorn_helm_sds_interface }}"
      mode: bridge
      ipam:
        type: whereabouts
        range: "{{ longhorn_helm_sds_network_cidr }}"
        range_start: "{{ longhorn_helm_sds_pod_range_start }}"
        range_end: "{{ longhorn_helm_sds_pod_range_end }}"
        configuration_path: /var/lib/rancher/k3s/agent/etc/cni/net.d/whereabouts.d/whereabouts.conf
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"
