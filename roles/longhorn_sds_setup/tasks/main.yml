---
- name: "Step 1: Install Python dependencies"
  apt:
    name: [python3-kubernetes, python3-yaml]
    state: present

- name: "Step 2: Create Longhorn Namespace explicitly"
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_path }}"
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ longhorn_helm_namespace }}"
    state: present
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"

- name: "Step 3: Add RKE2 Helm repository"
  kubernetes.core.helm_repository:
    name: "{{ multus_repo_name }}"
    repo_url: "{{ multus_repo_url }}"
    state: present
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"

- name: "Step 4: Deploy Multus and Whereabouts via RKE2 Helm Chart"
  kubernetes.core.helm:
    name: multus
    chart_ref: rke2-charts/rke2-multus
    release_namespace: kube-system
    kubeconfig: "{{ k3s_kubeconfig_path }}"
    update_repo_cache: yes
    values:
      config:
        cni_conf:
          confDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
          binDir: /var/lib/rancher/k3s/data/current/bin/
          kubeconfig: /var/lib/rancher/k3s/agent/etc/cni/net.d/multus.d/multus.kubeconfig
      rke2-whereabouts:
        fullnameOverride: whereabouts
        enabled: true
        cniConf:
          confDir: /var/lib/rancher/k3s/agent/etc/cni/net.d
          binDir: /var/lib/rancher/k3s/data/current/bin/
    wait: yes
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"

- name: "Step 5: Create NetworkAttachmentDefinition for 10G SDS (Handle 422 Error)"
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_path }}"
    definition:
      apiVersion: "k8s.cni.cncf.io/v1"
      kind: NetworkAttachmentDefinition
      metadata:
        name: "{{ longhorn_helm_sds_network_name }}"
        namespace: "{{ longhorn_helm_namespace }}"
      spec:
        config: "{{ nad_config_content | to_json }}"
  vars:
    nad_config_content:
      cniVersion: "0.3.1"
      name: "{{ longhorn_helm_sds_network_name }}"
      type: macvlan
      master: "{{ longhorn_helm_sds_interface }}"
      mode: bridge
      ipam:
        type: whereabouts
        range: "{{ longhorn_helm_sds_network_cidr }}"
        configuration_path: /var/lib/rancher/k3s/agent/etc/cni/net.d/whereabouts.d/whereabouts.conf
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"

- name: "Step 6: Deploy Longhorn v1.11.0 via Helm"
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_helm_version }}"
    release_namespace: "{{ longhorn_helm_namespace }}"
    create_namespace: yes
    kubeconfig: "{{ k3s_kubeconfig_path }}"
    values: "{{ lookup('template', 'values.yaml.j2') | from_yaml }}"
    wait: yes
    timeout: "600s"
  register: longhorn_helm_result
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"

- name: "Step 7: Remove default status from local-path StorageClass"
  kubernetes.core.k8s:
    kubeconfig: "{{ k3s_kubeconfig_path }}"
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: local-path
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
    state: patched
  ignore_errors: yes
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"

- name: "Step 8: Restart Longhorn Manager pods to apply network"
  shell: "kubectl delete pod -n {{ longhorn_helm_namespace }} -l app=longhorn-manager"
  ignore_errors: yes
  when: longhorn_helm_result is changed
  run_once: true
  delegate_to: "{{ k8s_delegate_host }}"
